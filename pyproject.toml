[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacing"
version = "0.2.0"
description = "Analyse du pacing et des performances en natation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "flet>=0.24.0",
    "flet-desktop>=0.24.0",
    "nicegui>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.25.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
pacing-desktop = "pacing.ui.desktop.app:run"
pacing-web = "pacing.ui.web.app:run"

[tool.setuptools.packages.find]
include = ["pacing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
